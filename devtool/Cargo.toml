[package]
name = "devtool"
version = "2.0.0"
edition = "2021"
description = "Senbit development tool: doctor, get, build, run (Fedora, Ubuntu/Debian, Arch)"

[[bin]]
name = "devtool"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "~4.4", features = ["derive"] }
colored = "2"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
opt-level = 2
