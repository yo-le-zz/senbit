[package]
name = "devtool"
version = "0.1.0"
edition = "2021"
description = "Senbit development tool: build, get, install, run"

[[bin]]
name = "devtool"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "~4.4", features = ["derive"] }
colored = "2"
indicatif = "0.17"
serde_json = "1"

[profile.release]
opt-level = 2
