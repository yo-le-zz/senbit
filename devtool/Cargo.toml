[package]
name = "senbit"
version = "0.1.0"
edition = "2021"
description = "Senbit build tooling (Rust port of scripts/*.sh) - build, run, install, getlinux, getutil"

[[bin]]
name = "senbit"
path = "src/main.rs"

[dependencies]
colored = "2.1"
indicatif = "0.17"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"

[profile.release]
opt-level = 2
