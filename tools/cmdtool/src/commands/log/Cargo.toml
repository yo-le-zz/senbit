[package]
name = "log"
version = "0.1.0"
edition = "2024"

[package.metadata.senbit]
install = "bin"

[[bin]]
name = "log"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"