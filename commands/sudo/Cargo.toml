[package]
name = "sudo"
version = "0.1.0"
edition = "2024"
description = "Run a command as root (Senbit native sudo)"

[package.metadata.senbit]
install = "bin"
setuid = true

[dependencies]
anyhow = "1.0"
crypt-sha512 = { version = "1.0.1", default-features = false, features = ["backend-rust-crypto"] }
libc = "0.2"