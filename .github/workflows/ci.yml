name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write

jobs:
  rust:
    name: Rust
    # No need to rebuild when a PR is merely closed
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Check Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            dwarves \
            cpio \
            gzip \
            xz-utils \
            bzip2 \
            git \
            wget \
            curl \
            rsync \
            file \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            mtools \
            qemu-system-x86 \
            qemu-utils \
            musl-tools \
            libreadline-dev \
            uuid-dev \
            libpam0g-dev \
            gettext \
            gperf \
            texinfo

      - name: Check Rust
        run: cargo check --target x86_64-unknown-linux-musl

      - name: Build Rust
        run: cargo build --release --target x86_64-unknown-linux-musl

  build:
    name: Senbit build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    needs: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Check Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            dwarves \
            cpio \
            gzip \
            xz-utils \
            bzip2 \
            git \
            wget \
            curl \
            rsync \
            file \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            mtools \
            qemu-system-x86 \
            qemu-utils \
            musl-tools \
            libreadline-dev \
            uuid-dev \
            libpam0g-dev \
            gettext \
            gperf \
            texinfo

      # scripts/build.sh no longer exists: devtool replaces it.
      # Build devtool from source and place it in scripts/, where it
      # automatically detects the project root.
      - name: Build devtool
        run: |
          cargo build --release --manifest-path devtool/Cargo.toml
          install -m 755 devtool/target/release/devtool scripts/devtool

      # `devtool build kernel` does not fetch the kernel: only
      # `devtool get linux` clones the version pinned in config/kernel/version.
      - name: Fetch pinned kernel
        run: ./scripts/devtool get linux

      - name: Build Senbit
        run: ./scripts/devtool build

  cleanup:
    name: Delete merged branch
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });