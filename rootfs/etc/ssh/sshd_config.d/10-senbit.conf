# Senbit defaults for OpenSSH (sudo apt install openssh-server). The first value read wins,
# so this file, read before the ones that sort after it, sets them. See docs/SECURITY.md.

# Log in with a normal user, then use sudo: no direct root login.
PermitRootLogin no

# Fewer password attempts per connection, and no graphical forwarding on a server.
MaxAuthTries 4
X11Forwarding no
