# Senbit hardening defaults for the network and the filesystem (docs/SECURITY.md).
# Change one in /etc/sysctl.d/ (a file there with the same key wins).
#
# Nothing here changes ip_forward: Docker and routers set it themselves.

# Do not follow ICMP redirects or send them: a router is not what this machine is.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Refuse source routing.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# SYN flood protection, and loose reverse-path filtering (2 keeps asymmetric routes working).
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Do not answer broadcast pings.
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Links and files in sticky directories (/tmp): the usual symlink and hardlink attacks.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 1

# Randomized memory layout, and kernel addresses hidden from normal users.
kernel.randomize_va_space = 2
kernel.kptr_restrict = 1
