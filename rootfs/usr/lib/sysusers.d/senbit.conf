# System accounts and groups that Senbit and Debian packages expect.
# Created by systemd-sysusers at every boot (idempotent: an existing name is
# left untouched). Interactive accounts (root, the user created by the
# installer) live in /etc/passwd, written by the installer; senbit-login only
# offers UID >= 1000 plus root.
#
# IDs are dynamic ("-"): systemd's own basic.conf already uses fixed ids that
# Debian gives to other names (e.g. gid 33 = tape for systemd, www-data for
# Debian), and no package depends on a number. `u` creates the user's group.
#
# The systemd-sysusers.service drop-in (systemd-sysusers.service.d/10-senbit.conf)
# makes this run at every boot: without it systemd skips the service as soon as
# /etc/passwd exists, and none of these accounts (not even _apt) would exist.
#
# Type Name        ID  GECOS / [GROUP]            Home                  Shell
g     shadow       -   -
g     sudo         -   -
g     staff        -   -
g     operator     -   -
g     src          -   -
g     sasl         -   -
g     plugdev      -   -
g     fax          -   -
g     voice        -   -
u     _apt         -   "APT sandbox"              /nonexistent          /usr/sbin/nologin
u     daemon       -   "daemon"                   /usr/sbin             /usr/sbin/nologin
u     bin          -   "bin"                      /bin                  /usr/sbin/nologin
u     sys          -   "sys"                      /dev                  /usr/sbin/nologin
u     sync         -   "sync"                     /bin                  /bin/sync
u     games        -   "games"                    /usr/games            /usr/sbin/nologin
u     man          -   "man"                      /var/cache/man        /usr/sbin/nologin
u     lp           -   "lp"                       /var/spool/lpd        /usr/sbin/nologin
u     mail         -   "mail"                     /var/mail             /usr/sbin/nologin
u     news         -   "news"                     /var/spool/news       /usr/sbin/nologin
u     uucp         -   "uucp"                     /var/spool/uucp       /usr/sbin/nologin
u     proxy        -   "proxy"                    /bin                  /usr/sbin/nologin
u     www-data     -   "www-data"                 /var/www              /usr/sbin/nologin
u     backup       -   "backup"                   /var/backups          /usr/sbin/nologin
u     list         -   "Mailing List Manager"     /var/list             /usr/sbin/nologin
u     irc          -   "ircd"                     /run/ircd             /usr/sbin/nologin
# D-Bus system bus (package dbus): lets non-root users run `systemctl status`.
u     messagebus   -   "System Message Bus"       /nonexistent          /usr/sbin/nologin
