# Senbit: rebuild the shared library cache at EVERY boot.
#
# systemd only runs ldconfig.service after a /usr update (ConditionNeedsUpdate=/etc),
# so the service was skipped and libraries installed by apt were not always
# found. An empty assignment clears the condition: the service now runs at each
# boot (a few milliseconds) and shows as "active (exited)".
# (It replaces Senbit's own senbit-ldconfig.service: two services rebuilding the
# cache at the same time made one of them fail while renaming ld.so.cache~.)
[Unit]
ConditionNeedsUpdate=
