# Senbit: create the system accounts of /usr/lib/sysusers.d/*.conf at EVERY boot.
#
# By default systemd runs sysusers only on a first boot or when /usr is newer
# than /etc ("ConditionNeedsUpdate=|/etc") or when /etc/passwd is missing. On
# Senbit /etc/passwd is written by the installer, so the service was always
# skipped ("Create System Users skipped") and the accounts apt and the
# Debian packages need (_apt, www-data, daemon, ...) never existed.
# systemd-sysusers is idempotent and takes a few milliseconds.
[Unit]
# An empty assignment clears the conditions of the original unit.
ConditionNeedsUpdate=
ConditionPathExists=
