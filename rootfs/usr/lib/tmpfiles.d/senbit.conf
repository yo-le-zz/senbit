# Directories, ownership and permissions of the running system.
# Applied by systemd-tmpfiles at every boot (idempotent).
#
# Type Path                              Mode  User  Group  Age
d /root                                  0700  root  root   -
d /home                                  0755  root  root   -
d /tmp                                   1777  root  root   -
d /var/tmp                               1777  root  root   -
d /var/log                               0755  root  root   -
d /var/cache                             0755  root  root   -
d /var/lib                               0755  root  root   -
d /var/spool                             0755  root  root   -
d /var/mail                              2775  root  root   -
d /run/lock                              0755  root  root   -
d /usr/local/bin                         0755  root  root   -
d /usr/local/sbin                        0755  root  root   -
d /usr/local/lib                         0755  root  root   -
d /usr/local/share                       0755  root  root   -
# Login database: password hashes readable by root only.
z /etc/shadow                            0600  root  root   -
z /etc/gshadow                           0600  root  root   -
z /etc/passwd                            0644  root  root   -
z /etc/group                             0644  root  root   -
# apt downloads as the unprivileged _apt user (sandbox).
d /var/lib/apt/lists/partial             0700  _apt  root   -
d /var/cache/apt/archives/partial        0700  _apt  root   -
d /var/log/apt                           0755  root  root   -
d /var/lib/dpkg                          0755  root  root   -
d /var/lib/dpkg/updates                  0755  root  root   -
# debconf (installed by apt) keeps its database here.
d /var/cache/debconf                     0755  root  root   -
d /var/lib/dpkg/alternatives             0755  root  root   -
d /etc/alternatives                      0755  root  root   -
d /var/lib/systemd                       0755  root  root   -
d /var/backups                           0755  root  root   -
d /var/www                               0755  root  root   -
d /var/cache/man                         0755  man   root   -
d /usr/games                             0755  root  root   -
# Senbit configuration.
d /etc/senbit                            0755  root  root   -
# D-Bus: machine-id shared with systemd.
d /var/lib/dbus                          0755  root  root   -
L /var/lib/dbus/machine-id               -     -     -      - /etc/machine-id
